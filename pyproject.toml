[project]
name = "write-a-data-science-blog-post-project"
version = "0.1.0"
description = "Write a data science blog post project"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "ipykernel>=7.1.0",
    "nltk>=3.10.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "textblob>=0.19.0",
    "wordcloud>=1.9.4",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/write_a_data_science_blog_post_project"
Repository = "https://github.com/simonerigoni/write_a_data_science_blog_post_project"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
